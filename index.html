function fmt(n) {
  n = Math.floor(n);
  if (state.settings.compact && n >= 10000) {
    const u = ["", "K", "M", "B", "T", "Qa"];
    let k = 0, x = n;
    while (x >= 1000 && k < u.length - 1) { x /= 1000; k++; }
    return (x < 100 ? x.toFixed(1) : Math.floor(x)) + u[k];
  }
  return n.toLocaleString();
}
const money = n => "$" + fmt(n);
function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

function setSaveStatus(ok) {

  el.classList.toggle("bad", !ok);
  el.textContent = ok
    ? "💾 Auto-save is on. Your progress saves automatically."

}

function sanitize(s) {
  if (!s || typeof s !== "object" || typeof s.coins !== "number") throw new Error("bad save");
  const out = Object.assign(fresh(), s);
  ["found", "potions", "shiny", "rainbow", "voids", "ach"].forEach(k => {
    if (!out[k] || typeof out[k] !== "object" || Array.isArray(out[k])) out[k] = {};
  });
  ["coins", "luckLvl", "rolls", "speedLvl"].forEach(k => { out[k] = Math.max(0, Number(out[k]) || 0); });
  const hadStats = s.stats && typeof s.stats === "object";
  out.stats = Object.assign(fresh().stats, hadStats ? s.stats : {});
  if (!hadStats) { out.stats.luckBought = out.luckLvl; out.stats.peak = out.coins; }
  out.settings = Object.assign(fresh().settings, s.settings && typeof s.settings === "object" ? s.settings : {});
  out.settings.autoStop = Number.isInteger(out.settings.autoStop) ? out.settings.autoStop : -1;

  if (!s.v || s.v < 15) {
    const oldLvl = out.speedLvl;
    const oldDelay = Math.max(50, 300 - 50 * oldLvl);
    out.speedLvl = SPEEDS.findIndex(d => d <= oldDelay);
    out.autoUnlocked = oldLvl > 0;
    out.v = 15;
  }
  out.speedLvl = Math.min(out.speedLvl, maxSpeedLvl);
  out.autoUnlocked = !!out.autoUnlocked;
  out.best = Math.min(Math.max(-1, out.best | 0), RARITIES.length - 1);

  if (!out.stats.bestVal) {
    let bv = out.best >= 0 ? RARITIES[out.best].chance : 0;
    RARITIES.forEach(r => {
      [1, 2, 3].forEach(m => {
        if (out[MUT_KEYS[m]][r.name]) bv = Math.max(bv, r.chance * MUTATIONS[m].chance);
      });
    });
    out.stats.bestVal = bv;
  }

  out.quests = (Array.isArray(out.quests) ? out.quests : [])
    .filter(q => q && QUESTS[q.type] && q.goal > 0 && q.reward > 0)
    .map(q => ({ type: q.type, goal: +q.goal, prog: Math.min(+q.prog || 0, +q.goal), reward: +q.reward }))
    .slice(0, 3);

  out.log = (Array.isArray(out.log) ? out.log : [])
    .map(e => Array.isArray(e) ? e : [e, 0])
    .filter(e => Number.isInteger(e[0]) && e[0] >= 0 && e[0] < RARITIES.length && [0, 1, 2, 3].includes(e[1]))
    .slice(0, 8);
  return out;
}

function load() {
  if (!store) return;
  try {
    const raw = store.getItem(SAVE_KEY);
    if (raw) state = sanitize(JSON.parse(raw));
  } catch (e) {}
}
function save() {
  if (!store) { setSaveStatus(false); return; }
  try {
    store.setItem(SAVE_KEY, JSON.stringify(state));
    setSaveStatus(true);
  } catch (e) { setSaveStatus(false); }
}

const encodeSave = s => btoa(unescape(encodeURIComponent(JSON.stringify(s))));
const decodeSave = c => JSON.parse(decodeURIComponent(escape(atob(c.trim()))));

function saveMsg(text, color) {
  const m = document.getElementById("saveMsg");
  m.textContent = text;
  m.style.color = color || "";
}

document.getElementById("exportBtn").onclick = () => {
  const code = encodeSave(state);
  const box = document.getElementById("saveBox");
  box.value = code;
  box.select();
  let copied = false;
  try { copied = document.execCommand("copy"); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => saveMsg("✅ Code copied! Keep it somewhere safe.", "#6fe3a0")).catch(() => {});
  saveMsg(copied ? "✅ Code copied! Keep it somewhere safe." : "Code is in the box. Copy it and keep it safe.", "#6fe3a0");
};

document.getElementById("importBtn").onclick = () => {
  const code = document.getElementById("saveBox").value;
  if (!code.trim()) { saveMsg("Paste a save code in the box first.", "#ffb86b"); return; }
  try {
    const loaded = sanitize(decodeSave(code));
    if (!confirm("Load this save? Your current progress will be replaced.")) return;
    stopAuto();
    state = loaded;
    fillQuests(); questSig = "";
    document.getElementById("autoStop").value = state.settings.autoStop;
    save(); render(); resetBox(); renderTab();
    saveMsg("✅ Save loaded!", "#6fe3a0");
    toast("💾 Save loaded!", "#6fe3a0", true);
  } catch (e) {
    saveMsg("❌ That code doesn't work. Check you copied all of it.", "#ff6b6b");
  }
};

];

function checkAch() {
  let any = false;
  ACH.forEach(a => {
    if (state.ach[a.id]) return;
    const [c, g] = a.p();
    if (c >= g) {
      state.ach[a.id] = true;
      earn(a.reward);
      any = true;
      toast(`🏆 ${a.name}! +${money(a.reward)}`, "#ffd700");
    }
  });
  return any;
}

function renderAch() {
  const done = ACH.filter(a => state.ach[a.id]).length;
  document.getElementById("achCount").textContent = `${done}/${ACH.length}`;
  document.getElementById("achList").innerHTML = ACH.map(a => {
    const got = !!state.ach[a.id];
    const [c, g] = a.p();
    const pct = got ? 100 : Math.min(100, (c / g) * 100);
    const prog = g > 1 && !got ? ` • ${fmt(Math.min(c, g))}/${fmt(g)}` : "";
    return `<div class="ach ${got ? "done" : ""}">
      <div class="t">${got ? "✅" : "🔒"} ${a.name}</div>
      <div class="d">${a.desc}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="r">Reward: ${money(a.reward)}${prog}</div>
    </div>`;
  }).join("");
}

// ---------- Quests ----------
const questTier = () => Math.min(30, 1 + Math.floor(state.luckLvl / 15) + Math.floor(state.stats.quests / 5));

function newQuest() {
  const used = state.quests.map(q => q.type);
  const options = Object.keys(QUESTS).filter(t => !used.includes(t));
  const type = options[Math.floor(Math.random() * options.length)];
  const t = questTier();
  return { type, goal: QUESTS[type].goal(t), prog: 0, reward: QUESTS[type].reward(t) };
}
function fillQuests() {
  while (state.quests.length < 3) state.quests.push(newQuest());
}
function questProgress(type, n) {
  state.quests.forEach(q => {
    if (q.type === type && q.prog < q.goal) q.prog = Math.min(q.goal, q.prog + n);
  });
}
function claimQuest(idx) {
  const q = state.quests[idx];
  if (!q || q.prog < q.goal) return;
  earn(q.reward);
  state.stats.quests++;
  toast(`📜 Quest complete! +${money(q.reward)}`, "#22c37a", true);
  state.quests.splice(idx, 1);
  state.quests.splice(idx, 0, newQuest());
  checkAch(); save(); render();
}

let questSig = "";
function renderQuests() {
  const sig = JSON.stringify(state.quests) + state.settings.compact;
  if (sig === questSig) return;
  questSig = sig;
  const ready = state.quests.filter(q => q.prog >= q.goal).length;
  document.getElementById("questCount").textContent = ready ? `${ready} ready!` : `Done: ${fmt(state.stats.quests)}`;
  document.getElementById("questList").innerHTML = state.quests.map((q, idx) => {
    const done = q.prog >= q.goal;
    return `<div class="quest ${done ? "ready" : ""}">
      <div class="qt">${QUESTS[q.type].text(q.goal)}</div>
      <div class="qr"><span>${fmt(q.prog)}/${fmt(q.goal)}</span><span>${money(q.reward)}</span></div>
      <div class="bar"><i style="width:${Math.min(100, q.prog / q.goal * 100)}%"></i></div>
      ${done ? `<button data-q="${idx}">Claim ${money(q.reward)}</button>` : ""}
    </div>`;
  }).join("");
}
document.getElementById("questList").addEventListener("click", e => {

});

let curEvent = null, eventEnd = 0;
let nextEvent = Date.now() + randGap();
function randGap() { return (EVENT_GAP[0] + Math.random() * (EVENT_GAP[1] - EVENT_GAP[0])) * 1000; }
const evMult = k => (curEvent && curEvent[k]) || 1;

function startEvent() {
  const total = EVENTS.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  curEvent = EVENTS.find(e => (r -= e.weight) < 0) || EVENTS[0];
  eventEnd = Date.now() + EVENT_LENGTH * 1000;
  state.stats.events++;
  toast(`${curEvent.name} has started! ${curEvent.desc}`, curEvent.color, true);
  checkAch();
  render();
}
function endEvent() {
  curEvent = null;
  nextEvent = Date.now() + randGap();
  render();
}
function renderEvent() {
  const bar = document.getElementById("eventBar");
  const glow = document.getElementById("evGlow");
  if (curEvent) {
    const left = Math.max(0, Math.ceil((eventEnd - Date.now()) / 1000));

    bar.textContent = `${curEvent.name} — ${curEvent.desc} • ${left}s left`;

  } else {

    bar.className = "eventBar";
    bar.style.borderColor = ""; bar.style.background = "";

}

// ---------- Game logic ----------
const baseLuck = () => 1 + state.luckLvl * LUCK_STEP;
const potionMult = key => POTIONS.reduce((m, p) => (state.potions[p.id] > 0 ? m * p[key] : m), 1);
const totalLuck = () => baseLuck() * potionMult("luck") * evMult("luck");
const moneyMult = () => potionMult("coins") * evMult("money");
const mutChance = m => MUTATIONS[m].chance / evMult(MUT_EVENT_KEYS[m]);
const luckCost = (lvl = state.luckLvl) => Math.floor(LUCK_BASE_COST * Math.pow(LUCK_COST_GROWTH, lvl));
const autoDelay = () => SPEEDS[state.speedLvl];
const rps = () => { const r = 1000 / autoDelay(); return r < 10 ? r.toFixed(1) : Math.round(r); };
const speedCost = () => Math.floor(SPEED_BASE_COST * Math.pow(SPEED_COST_GROWTH, state.speedLvl));
const isTurbo = () => !!autoTimer && autoDelay() < DISPLAY_MS;

function roll() {
  const L = totalLuck();
  for (let i = RARITIES.length - 1; i >= 1; i--) {
    if (Math.random() < L / RARITIES[i].chance) return i;
  }
  return 0;
}
function rollMutation() {
  for (let m = 3; m >= 1; m--) {
    if (Math.random() < 1 / mutChance(m)) return m;
  }
  return 0;
}

// Real chance of each rarity with current luck
function rarityOdds() {
  const L = totalLuck(), out = [];
  let rest = 1;
  for (let i = RARITIES.length - 1; i >= 1; i--) {
    const p = Math.min(1, L / RARITIES[i].chance);
    out[i] = rest * p;
    rest *= 1 - p;
  }
  out[0] = rest;
  return out;
}

function pushLog(i, m) {
  state.log.unshift([i, m]);
  if (state.log.length > 8) state.log.length = 8;
}

let stopHit = null;

function processRoll(i, m, addToLog) {
  const r = RARITIES[i];
  const earned = r.coins * MUTATIONS[m].mult * moneyMult();
  const val = r.chance * MUTATIONS[m].chance;
  const firstTime = m === 0 ? !state.found[r.name] : !state[MUT_KEYS[m]][r.name];
  const rareEnough = i >= 5 || m >= 2 || (m === 1 && i >= 4);
  const stillSpecial = firstTime || val * NOTIFY_RANGE > state.stats.bestVal;

  state.rolls++;
  earn(earned);
  state.found[r.name] = (state.found[r.name] || 0) + 1;
  if (m) state[MUT_KEYS[m]][r.name] = (state[MUT_KEYS[m]][r.name] || 0) + 1;
  if (m === 1) state.stats.shinies++;
  if (m === 2) state.stats.rainbows++;
  if (m === 3) state.stats.voids++;
  if (i >= 4) state.stats.rarePlus++;
  if (i > state.best) state.best = i;
  if (val > state.stats.bestVal) state.stats.bestVal = val;
  if (addToLog) pushLog(i, m);
  POTIONS.forEach(p => { if (state.potions[p.id] > 0) state.potions[p.id]--; });

  questProgress("rolls", 1);
  if (i >= 4) questProgress("rare", 1);
  if (m === 1) questProgress("shiny", 1);
  if (curEvent) questProgress("event", 1);

  if (autoTimer && state.settings.autoStop >= 0 && i >= state.settings.autoStop) stopHit = label(i, m);

  if (rareEnough && stillSpecial) {
    const big = i >= 5 || (m >= 2 && i >= 4);
    if (!(big && cutscene(i, m, val))) {
      toast(`✨ ${label(i, m).toUpperCase()}! (1 in ${fmt(val)})`, mutColor(i, m));
    }
  }
  return earned;
}

function applyRoll(i, m) {
  const earned = processRoll(i, m, true);
  showResult(i, m, earned, true);
  checkAch();
  save();
  render();
}

function quickRoll() { applyRoll(roll(), rollMutation()); }

function animatedRoll() {
  if (spinning || autoTimer) return;
  if (!state.settings.anim) { quickRoll(); return; }
  spinning = true;
  render();
  const result = roll();
  const mut = rollMutation();
  const box = document.getElementById("box");
  const nm = document.getElementById("resultName");
  const odds = document.getElementById("resultOdds");
  box.classList.add("spinning");
  box.style.boxShadow = "";
  nm.className = "name";
  odds.textContent = "rolling...";

  const maxShow = Math.min(RARITIES.length - 1, Math.max(4, state.best + 2));
  let delay = 40;
  function step() {
    const r = RARITIES[Math.floor(Math.random() * (maxShow + 1))];
    nm.textContent = r.name;
    nm.style.color = r.color;
    box.style.borderColor = r.color;
    delay *= 1.13;
    if (delay < 320) setTimeout(step, delay);
    else {
      box.classList.remove("spinning");
      spinning = false;
      applyRoll(result, mut);
    }
  }
  step();
}

function showResult(i, m, earned, animate) {
  const r = RARITIES[i];
  const box = document.getElementById("box");
  const nm = document.getElementById("resultName");
  nm.textContent = label(i, m);
  nm.style.color = r.color;
  nm.className = "name" + mutClass(m);
  const mutTxt = m ? ` • ${MUTATIONS[m].mult}x ${MUTATIONS[m].name}` : "";
  document.getElementById("resultOdds").textContent =
    `1 in ${fmt(r.chance)}${mutTxt}  •  +${money(earned)}`;
  const c = mutColor(i, m);
  box.style.borderColor = c;
  const special = i >= 4 || m >= 2;
  box.classList.remove("glow", "pop"); void box.offsetWidth;
  if (animate || special) box.classList.add("pop");
  if (state.settings.fx && special) {
    box.style.boxShadow = `inset 0 0 60px rgba(0,0,0,.7), 0 0 40px ${c}`;
    box.classList.add("glow");
  } else box.style.boxShadow = "";
}

function resetBox() {
  const nm = document.getElementById("resultName");
  nm.textContent = "Press ROLL"; nm.style.color = ""; nm.className = "name";
  document.getElementById("resultOdds").textContent = "or hit Space";
  const box = document.getElementById("box");
  box.style.borderColor = ""; box.style.boxShadow = "";
}

let cutTimer;
const cutEl = document.getElementById("cut");
function cutscene(i, m, val) {
  if (!state.settings.cutscene) return false;
  const color = mutColor(i, m);
  const nm = document.getElementById("cutName");
  nm.textContent = label(i, m).toUpperCase();
  nm.style.color = RARITIES[i].color;
  nm.className = "cut-name" + mutClass(m);
  document.getElementById("cutOdds").textContent = `1 IN ${fmt(val)}`;
  cutEl.querySelectorAll(".spark").forEach(s => s.remove());
  for (let k = 0; k < 28; k++) {
    const s = document.createElement("span");
    s.className = "spark";
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 220;
    s.style.setProperty("--x", Math.cos(ang) * dist + "px");
    s.style.setProperty("--y", Math.sin(ang) * dist + "px");
    s.style.background = Math.random() < .5 ? color : "#fff";
    s.style.boxShadow = `0 0 10px ${color}`;
    cutEl.appendChild(s);
  }
  cutEl.classList.remove("show"); void cutEl.offsetWidth;
  cutEl.classList.add("show");
  clearTimeout(cutTimer);
  cutTimer = setTimeout(hideCut, CUTSCENE_MS);
  return true;
}
function hideCut() { clearTimeout(cutTimer); cutEl.classList.remove("show"); }
cutEl.addEventListener("pointerdown", hideCut);

let toastTimer;
function toast(msg, color, force) {
  if (!state.settings.popups && !force) return;
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.borderColor = color; t.style.color = color;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function maxAffordable() {
  let n = 0, total = 0, lvl = state.luckLvl;
  while (n < 10000 && total + luckCost(lvl) <= state.coins) {
    total += luckCost(lvl); lvl++; n++;
  }
  return { n, total };
}

let renderQueued = false, lastRender = 0;
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  const wait = Math.max(0, 100 - (performance.now() - lastRender));
  setTimeout(() => { renderQueued = false; render(); }, wait);
}

let lastCoinsShown = -1;
function render() {
  lastRender = performance.now();
  const cf = document.getElementById("coinFloat");
  cf.textContent = money(state.coins);
  if (state.coins > lastCoinsShown && lastCoinsShown >= 0 && !autoTimer) {
    cf.classList.add("bump"); setTimeout(() => cf.classList.remove("bump"), 150);
  }
  lastCoinsShown = state.coins;

  document.getElementById("coins").textContent = money(state.coins);
  document.getElementById("luck").textContent = totalLuck().toFixed(1) + "x";
  document.getElementById("luck").style.color = totalLuck() > baseLuck() ? "#b388ff" : "";
  document.getElementById("rolls").textContent = fmt(state.rolls);
  const best = document.getElementById("best");
  if (state.best >= 0) { best.textContent = RARITIES[state.best].name; best.style.color = RARITIES[state.best].color; }
  else { best.textContent = "—"; best.style.color = ""; }

  document.getElementById("rollBtn").disabled = spinning || !!autoTimer;

  const ab = document.getElementById("autoBtn");
  if (!state.autoUnlocked) {
    ab.className = "locked";
    ab.innerHTML = `🔒 Unlock Auto<br><small>${money(AUTO_UNLOCK_COST)}</small>`;
    ab.disabled = state.coins < AUTO_UNLOCK_COST;
  } else {
    ab.className = autoTimer ? "on" : "";
    ab.innerHTML = `AUTO: ${autoTimer ? "ON" : "OFF"}<br><small>${rps()}/sec</small>`;
    ab.disabled = false;
  }

  const lb = document.getElementById("luckBtn");
  lb.innerHTML = `Luck +${LUCK_STEP}<br><small>${money(luckCost())}</small>`;
  lb.disabled = state.coins < luckCost();

  const mx = maxAffordable();
  const maxBtn = document.getElementById("maxBtn");
  maxBtn.disabled = mx.n < 1;
  maxBtn.innerHTML = `Buy Max (x${mx.n})<br><small>${money(mx.total)}</small>`;

  const speedBtn = document.getElementById("speedBtn");
  if (state.speedLvl >= maxSpeedLvl) {
    speedBtn.innerHTML = `Auto Speed MAXED<br><small>${rps()} rolls/sec</small>`;
    speedBtn.disabled = true;
  } else {
    const next = Math.round(1000 / SPEEDS[state.speedLvl + 1] * 10) / 10;
    speedBtn.innerHTML = `Auto Speed Lv${state.speedLvl + 1}/${maxSpeedLvl} → ${next}/sec<br><small>${money(speedCost())}</small>`;
    speedBtn.disabled = state.coins < speedCost();
  }

  const shop = document.getElementById("potionShop");
  shop.innerHTML = "";
  POTIONS.forEach((p, idx) => {
    const b = document.createElement("button");
    b.className = "potion" + (idx === 2 ? " wide" : "");
    const left = state.potions[p.id] || 0;
    b.innerHTML = `${p.name}${left ? ` <small>(${left} left)</small>` : ""}<br><small>${p.desc} • ${money(p.cost)}</small>`;
    b.disabled = state.coins < p.cost;
    b.onclick = () => buyPotion(p);
    shop.appendChild(b);
  });

  let fx = POTIONS.filter(p => state.potions[p.id] > 0)
    .map(p => `<span class="chip">🧪 ${p.name} — ${state.potions[p.id]} rolls</span>`).join("");
  if (isTurbo()) fx = `<span class="chip turbo">⚡ TURBO • ${rps()} rolls/sec</span>` + fx;
  document.getElementById("effects").innerHTML = fx;

  const log = document.getElementById("log");
  log.innerHTML = state.log.length
    ? state.log.map(([i, m]) => `<div style="color:${mutColor(i, m)}">${label(i, m)} <span style="opacity:.5">— 1 in ${fmt(RARITIES[i].chance)}</span></div>`).join("")
    : `<div style="opacity:.5">No rolls yet</div>`;

  const col = document.getElementById("collection");
  col.innerHTML = "";
  RARITIES.forEach((r, i) => {
    const count = state.found[r.name] || 0;
    const sh = state.shiny[r.name] || 0, rb = state.rainbow[r.name] || 0, vd = state.voids[r.name] || 0;
    const div = document.createElement("div");
    div.className = "item";
    div.dataset.i = i;
    if (count) {
      div.style.borderLeftColor = r.color;
      div.style.background = `linear-gradient(90deg, ${r.color}22, transparent 80%)`;
    }
    const muts = (sh || rb || vd)
      ? `<div class="m">${sh ? `✨ x${fmt(sh)} ` : ""}${rb ? `🌈 x${fmt(rb)} ` : ""}${vd ? `🌑 x${fmt(vd)}` : ""}</div>` : "";
    div.innerHTML = count
      ? `<div class="n" style="color:${r.color}">${r.name}</div><div class="c">1 in ${fmt(r.chance)} • x${fmt(count)}</div>${muts}`
      : `<div class="n">???</div><div class="c">1 in ${fmt(r.chance)}</div>`;
    col.appendChild(div);
  });
  document.getElementById("colCount").textContent =
    `${foundKinds()}/${RARITIES.length} • ✨ ${shinyKinds()} • 🌈 ${kinds("rainbow")} • 🌑 ${kinds("voids")}`;

  document.getElementById("achTab").textContent =
    `🏆 Achievements (${ACH.filter(a => state.ach[a.id]).length}/${ACH.length})`;

  renderQuests();
  renderEvent();
  if (tab === "ach") renderAch();
}

// ---------- Shop ----------
document.getElementById("luckBtn").onclick = () => {
  const c = luckCost();
  if (state.coins < c) return;
  spend(c);
  state.luckLvl++;
  state.stats.luckBought++;
  questProgress("luck", 1);
  checkAch(); save(); render();
};

document.getElementById("maxBtn").onclick = () => {
  const mx = maxAffordable();
  if (mx.n < 1) return;
  spend(mx.total);
  state.luckLvl += mx.n;
  state.stats.luckBought += mx.n;
  questProgress("luck", mx.n);
  checkAch(); save(); render();
};

function buyPotion(p) {
  if (state.coins < p.cost) return;
  spend(p.cost);
  state.potions[p.id] = (state.potions[p.id] || 0) + p.rolls;
  state.stats.potions++;
  questProgress("potion", 1);
  toast(`🧪 ${p.name} active!`, "#b388ff");
  checkAch(); save(); render();
}

// ---------- Auto roll ----------
let autoAcc = 0, lastTick = 0, lastShow = 0, pending = null;
const score = (i, m) => i * 4 + m;

function flushPending() {
  if (!pending) return;
  showResult(pending.i, pending.m, pending.earned, false);
  pushLog(pending.i, pending.m);
  pending = null;
}

function handleStop() {
  const what = stopHit;
  stopHit = null;
  stopAuto();
  toast(`⏹️ Auto-stopped: ${what}`, "#22c37a", true);
  render();
}

function autoTick() {
  const now = performance.now();
  autoAcc += (now - lastTick) / autoDelay();
  lastTick = now;
  let n = Math.floor(autoAcc);
  autoAcc -= n;
  if (n > 200) n = 200;
  if (n < 1) return;

  if (!isTurbo() && n === 1) { quickRoll(); if (stopHit) handleStop(); return; }

  for (let k = 0; k < n; k++) {
    const i = roll(), m = rollMutation();
    const earned = processRoll(i, m, false);
    if (stopHit) { pending = { i, m, earned }; break; }
    if (!pending || score(i, m) > score(pending.i, pending.m)) pending = { i, m, earned };
  }
  if (stopHit) { flushPending(); checkAch(); handleStop(); return; }
  if (now - lastShow >= DISPLAY_MS && pending) {
    flushPending();
    lastShow = now;
  }
  checkAch();
  requestRender();
}

function startAuto() {
  clearInterval(autoTimer);
  autoAcc = 1; lastTick = performance.now(); pending = null; stopHit = null;
  autoTimer = setInterval(autoTick, 50);
}
function stopAuto() {
  if (!autoTimer) return;
  clearInterval(autoTimer); autoTimer = null;
  flushPending();
  save();
}

document.getElementById("autoBtn").onclick = () => {
  if (spinning) return;
  if (!state.autoUnlocked) {
    if (state.coins < AUTO_UNLOCK_COST) return;
    spend(AUTO_UNLOCK_COST);
    state.autoUnlocked = true;
    toast("🤖 Auto roll unlocked!", "#1fa65a", true);
    checkAch(); save(); render();
    return;
  }
  autoTimer ? stopAuto() : startAuto();
  render();
};

// Auto-stop picker
const stopSel = document.getElementById("autoStop");
stopSel.innerHTML = `<option value="-1">Off</option>` +
  RARITIES.map((r, i) => i >= 4 ? `<option value="${i}">${r.name}+</option>` : "").join("");
stopSel.onchange = () => { state.settings.autoStop = +stopSel.value; save(); };

document.getElementById("speedBtn").onclick = () => {
  if (state.coins >= speedCost() && state.speedLvl < maxSpeedLvl) {
    spend(speedCost());
    state.speedLvl++;
    checkAch(); save(); render();
  }
};

document.getElementById("rollBtn").onclick = animatedRoll;

document.getElementById("resetBtn").onclick = () => {
  if (confirm("Reset ALL progress, including achievements and stats? Export a save code first if you want a backup.")) {
    stopAuto();
    const keepSettings = state.settings;
    state = fresh();
    state.settings = keepSettings;
    fillQuests(); questSig = "";
    save(); render(); resetBox(); renderTab();
  }
};

document.addEventListener("keydown", (e) => {
  if (["TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "Escape") { infoEl.classList.remove("show"); hideCut(); }
  if (e.code === "Space" && tab === "game") { e.preventDefault(); if (!e.repeat) animatedRoll(); }
});

load();
fillQuests();
stopSel.value = state.settings.autoStop;
renderChangelog();
checkAch();
render();
save();
</script>
